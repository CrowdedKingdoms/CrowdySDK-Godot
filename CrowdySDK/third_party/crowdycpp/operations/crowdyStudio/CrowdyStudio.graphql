mutation CrowdyStudioProjectCreateFromModules(
  $input: CreateCrowdyStudioProjectFromModulesInput!
) {
  crowdyStudioProjectCreateFromModules(input: $input) {
    ...CrowdyStudioProjectFields
  }
}
